<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sibu Kamek | Let's Build Sibu Together</title>
    <link
      rel="preload"
      as="image"
      href="logo-optimized.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-top: 20vh;
        padding-bottom: 32px;
        background: #ffffff;
        color: #0f0f10;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .container {
        width: 100%;
        padding-inline: 16px;
        text-align: center;
      }

      .utility-bar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        padding: 8px 24px;
        background: #231f20;
        color: #cfd4d5;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .utility-inner {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        max-width: 2000px;
        margin: auto;
      }

      .utility-inner a {
        color: #d7df27;
        font-weight: 700;
        text-decoration: none;
      }

      .landing-logo {
        display: block;
        /* Change this width to resize the homepage logo. Height follows automatically. */
        width: 320px;
        max-width: 100%;
        height: auto;
        margin: 0 auto 1rem;
      }

      .links {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .link {
        color: #555555;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.4rem 0.2rem;
        border-bottom: 2px solid transparent;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }

      .link:hover,
      .link:focus {
        color: #0f0f10;
        border-bottom-color: #0f0f10;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="utility-bar">
        <div class="container utility-inner">
          <a href="index.html"
            >Sibu Kamek Portal <span aria-hidden="true">&#8599;</span></a
          >
        </div>
      </div>
      <img
        class="landing-logo"
        src="logo-optimized.webp"
        alt="Sibu Kamek Logo"
        width="320"
        height="360"
        fetchpriority="high"
        decoding="async"
      />

      <nav class="links" aria-label="Main navigation">
        <a href="about.html" class="link">About</a>
        <a href="initiatives.html" class="link">Initiatives</a>
        <a href="programmes.html" class="link">Programmes</a>
        <a href="progress.html" class="link">Progress</a>
        <a href="contact.html" class="link">Contact</a>
      </nav>
    </main>
  </body>
</html>

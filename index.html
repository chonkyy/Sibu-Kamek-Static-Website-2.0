  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding-top: 20vh;
  background: #ffffff;
  color: #0f0f10;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
  text-align: center;
}

.utility-bar {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  padding: 8px 24px;
  background: #231f20;
  color: #cfd4d5;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.utility-inner {
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  max-width: 2000px;
  margin: auto;
}

.utility-inner a {
  color: #d7df27;
  font-weight: 700;
  text-decoration: none;
}

.landing-logo {
  display: block;
  width: 200px;
  height: 225px;
  margin: 0 auto 1rem;
  transform-origin: center center;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  margin-bottom: 1.5rem;
  flex-wrap: nowrap;
}

.title {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-family: 'Covered By Your Grace', cursive;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0;
  transform-origin: center center;
}

/* Pill mode switch */
.mode-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 64px;
  height: 34px;
  padding: 4px;
  background: #e5e5e5;
  border: 1px solid #c8c8c8;
  border-radius: 999px;
  cursor: pointer;
  flex-shrink: 0;
}

.mode-pill:hover {
  border-color: #8a8a8a;
}

.mode-pill:focus-visible {
  outline: 2px solid #0f0f10;
  outline-offset: 2px;
}

.pill-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.25s ease;
  z-index: 1;
}

.mode-pill[aria-checked="true"] .pill-thumb {
  transform: translateX(30px);
}

.pill-icon {
  position: relative;
  z-index: 2;
  width: 22px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777777;
  pointer-events: none;
  margin: 0 1px;
}

.pill-icon svg {
  width: 15px;
  height: 15px;
}

.mode-pill[aria-checked="false"] .pill-icon--classic {
  color: #000000;
}

.mode-pill[aria-checked="true"] .pill-icon--visual {
  color: #000000;
}

.links {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.link {
  color: #555555;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  padding: 0.4rem 0.2rem;
  border-bottom: 2px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.link:hover,
.link:focus {
  color: #0f0f10;
  border-bottom-color: #0f0f10;
}

/* These rules only affect Visualized mode and its information panel. */
#visualTree[hidden] { display:none; }
body[data-mode="visualized"] > main { width:100%; }
#visualTree {
  --wood:#513727;
  --ochre:#ae814b;
  --green-1:#204b35;
  --green-2:#41764a;
  --green-3:#85a960;
  width:min(calc(100% - 24px),1100px);
  margin:0 auto;
  padding-top:40px;
}
#visualTree.tree-exiting .tree-hint, #visualTree.tree-exiting #treeContext { visibility:hidden; }
.tree-stage { display:grid; grid-template-columns:minmax(0,1fr); align-items:center; }
#treeSvg { display:block; width:min(100%,640px); height:auto; aspect-ratio:1; justify-self:center; overflow:visible; }
#visualTree [role="button"] { cursor:pointer; outline:none; }
#visualTree [role="button"]:focus-visible { filter:drop-shadow(0 0 3px var(--ochre)); }
#visualTree .tier { transition:opacity .2s ease; }
#treeContext {
  width:100%; max-width:420px; min-height:7.8em; margin:0 auto;
  padding:8px 16px; text-align:center; font-size:13px; line-height:1.55;
  overflow-wrap:anywhere; opacity:0; visibility:hidden; transition:opacity .2s ease;
}
#treeContext strong { display:block; margin-bottom:6px; color:var(--green-1); font-size:14px; }
#treeContext.visible { opacity:1; visibility:visible; }
#visualTree .tree-hint { margin:12px 12px 24px; font-size:12px; line-height:1.6; color:#666; }
#treeDrawer {
  position:fixed; inset:0; width:min(1060px,calc(100% - 64px)); height:min(850px,90dvh);
  max-width:none; max-height:none; margin:auto; padding:0; overflow:hidden;
  border:0; border-radius:0; color:#231f20; background:#fff; text-align:left;
  box-shadow:10px 10px 0 #d7df27;
}
#treeDrawer[open] { display:flex; flex-direction:column; animation:tree-panel-in .22s ease-out; }
@keyframes tree-panel-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
#treeDrawer::backdrop { background:#231f20bb; }
.tree-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; border-bottom:1px solid #ddd; }
#treeDrawerTitle { font-size:18px; }
#treeClose { flex-shrink:0; min-width:44px; min-height:44px; border:0; background:#231f20; color:white; cursor:pointer; font:inherit; padding:8px 14px; }
#treeClose:hover, #treeClose:focus-visible { background:#ee4036; }
#treeDrawer :focus-visible { outline:3px solid #2d6983; outline-offset:3px; }
#treePage { width:100%; flex:1; min-height:0; border:0; background:#fff; }
body.tree-modal-open { overflow:hidden; }
#Bark { opacity:0; transition:opacity .3s; pointer-events:none; }
#Programmes.is-active #Bark { opacity:.65; }
#visualTree .tier.is-active { filter:drop-shadow(0 0 3px #ae814b88); }
body.tree-returning .landing-logo, body.tree-returning .links { visibility:hidden !important; }
@media(min-width:700px) {
  #treeSvg { width:min(100%,640px,max(340px,calc(100svh - 210px))); }
}
@media(max-width:699px) {
  #treeDrawer { width:100%; height:100dvh; margin:0; box-shadow:none; }
  .tree-toolbar { padding:10px 14px; }
}
@media(prefers-reduced-motion:reduce) {
  #Bark { transition:none; }
  #treeDrawer[open] { animation:none; }
}
@media(min-width:1080px) {
  .tree-stage { grid-template-columns:190px minmax(0,1fr) 190px; }
  #treeSvg { grid-column:2; grid-row:1; }
  #treeContext { grid-column:3; grid-row:1; border-left:1px dashed var(--ochre); padding:12px 0 12px 18px; text-align:left; }
}
@media(prefers-reduced-motion:reduce) {
  #visualTree .tier, #treeContext, .pill-thumb { transition:none; }
}

  <script>
// Content metadata used to distribute programme and news foliage.
const SIBU_DATA = {
  "Leaves": {
    "title": "News & Community",
    "href": "news.html",
    "text": "Notes, updates and stories from the people and places shaping the Sibu Kamek journey.",
    "linkLabel": "Explore News"
  },
  "Programmes": [
    {
      "title": "Stakeholder mapping",
      "href": "programmes.html",
      "text": "Discussions and exploration to understand who should be engaged in Sibu's future."
    },
    {
      "title": "Wishing trees",
      "href": "programmes.html",
      "text": "Tree-shaped boards in public spaces where anyone writes what they wish for Sibu."
    },
    {
      "title": "Surveys and media",
      "href": "programmes.html",
      "text": "A survey for citizens and diaspora in multiple languages, carried by paper, digital, radio and social media."
    },
    {

      "href": "programmes.html",
      "text": "Sessions for children, youth and elders to explore Sibu's possible futures before making choices."
    },
    {
      "title": "Public dashboard",
      "href": "programmes.html",
      "text": "Everything Sibu said, shown openly online so anyone can see it and respond."
    },
    {
      "title": "Seat for the Rajang",
      "href": "programmes.html",
      "text": "The river and the forest given a voice in decisions that will change them."
    }
  ],
  "News": [
    {
      "title": "Wishing Trees begin their first harvest",
      "href": "news.html",
      "label": "14 September 2026 · Programme update",
      "date": "2026-09-14"
    },
    {
      "title": "A new conversation starts at Central Market",
      "href": "news.html",
      "label": "03 September 2026 · Community voices",
      "date": "2026-09-03"
    },
    {
      "title": "Young Sibu imagines a city that stays",
      "href": "news.html",
      "label": "27 August 2026 · Field notes",
      "date": "2026-08-27"
    },
    {
      "title": "Six places, one shared invitation",
      "href": "news.html",
      "label": "19 August 2026 · Across the division",
      "date": "2026-08-19"
    }
  ]
};

document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const section = $('visualTree');
  const svg = $('treeSvg');
  const drawer = $('treeDrawer');
  const toggle = $('modeToggle');
  const logo = document.querySelector('.landing-logo');
  const nav = document.querySelector('.links');
  const keys = ['Roots', 'Programmes', 'Leaves'];
  const destinations = { Roots:{title:'About', href:'about.html'}, Programmes:{title:'Programmes', href:'programmes.html'}, Leaves:{title:'News & Outcomes', href:'news.html'} };
  const tiers = keys.map($);
  const ns = 'http://www.w3.org/2000/svg';
  const HOME = '0 0 800 800';
  // All structural parts use the same origin: the collar is at (400, 500).
  // Wood: x=100..700, y=96..660. Foliage: x=55..745, y=45..400.
  let visual = false;
  let growthFrame=0, growthTime=0, pendingGrowth, opener, modeTransition;
  const transitionAnimations=[], transitionGhosts=[];
  const gs=window.gsap;

  function element(tag, parent, attributes = {}) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
    parent.append(node);
    return node;
  }
  function path(parent, d, attributes = {}) {
    return element('path', parent, { d, ...attributes });
  }
  function point(curve, t) {
    const u = 1 - t;
    return [0, 1].map(k => u*u*u*curve[0][k] + 3*u*u*t*curve[1][k] + 3*u*t*t*curve[2][k] + t*t*t*curve[3][k]);
  }
  function tangent(curve, t) {
    const u = 1 - t;
    return [0, 1].map(k => 3*u*u*(curve[1][k]-curve[0][k]) + 6*u*t*(curve[2][k]-curve[1][k]) + 3*t*t*(curve[3][k]-curve[2][k]));
  }
  function unit(vector) {
    const length = Math.hypot(...vector) || 1;
    return vector.map(value => value / length);
  }
  // Match child emergence to distance along its parent's revealed path.
  function arcFraction(curve,t) {
    let total=0,partial=0,previous=point(curve,0);
    for(let i=1;i<=100;i++) {
      const current=point(curve,i/100), length=Math.hypot(current[0]-previous[0],current[1]-previous[1]);
      total+=length;
      partial+=length*Math.min(1,Math.max(0,t*100-(i-1)));
      previous=current;
    }
    return partial/total;
  }
  function coords(p) { return p.map(n => n.toFixed(2)).join(' '); }
  // A smooth tapered ribbon around a cubic centreline. Every twig starts on
  // its parent's actual curve, never on an independently estimated position.
  const growthParts = [];
  const defs = element('defs',svg);
  function revealAlong(node, d, width, start, duration) {
    const id='growth-'+growthParts.length;
    const mask=element('mask',defs,{id,maskUnits:'userSpaceOnUse',x:0,y:0,width:800,height:800});
    const stroke=path(mask,d,{fill:'none',stroke:'white','stroke-width':width,'stroke-linecap':'butt',pathLength:1});
    const length=stroke.getTotalLength();
    const samples=Array.from({length:81},(_,i)=>{
      const p=stroke.getPointAtLength(length*i/80);
      const before=stroke.getPointAtLength(Math.max(0,length*i/80-.5));
      const after=stroke.getPointAtLength(Math.min(length,length*i/80+.5));
      const direction=unit([after.x-before.x,after.y-before.y]);
      return {x:p.x,y:p.y,nx:-direction[1],ny:direction[0]};
    });
    stroke.setAttribute('fill','white');stroke.setAttribute('stroke','none');
    growthParts.push({node,stroke,id,start,duration,width,samples});
  }
  function limb(parent, curve, width, hit = false, start=0, duration=.8) {
    const left = [], right = [];
    for (let i = 0; i <= 48; i++) {
      const t = i / 48, p = point(curve, t), v = unit(tangent(curve, t));
      const radius = width * .5 * Math.pow(1 - t, 1.35) + .12;
      left.push([p[0] - v[1]*radius, p[1] + v[0]*radius]);
      right.push([p[0] + v[1]*radius, p[1] - v[0]*radius]);
    }
    const outline = left.concat(right.reverse());
    let d = 'M' + coords(outline[0]);
    for (let i = 1; i < outline.length - 1; i++) {
      const mid = outline[i].map((value, k) => (value + outline[i+1][k]) / 2);
      d += ' Q' + coords(outline[i]) + ' ' + coords(mid);
    }
    const shape=path(parent, d + ' L' + coords(outline.at(-1)) + ' Z', { fill: 'var(--wood)' });
    revealAlong(shape,`M${coords(curve[0])} C${coords(curve[1])} ${coords(curve[2])} ${coords(curve[3])}`,width+8,start,duration);
    if (hit) path(parent, `M${coords(curve[0])} C${coords(curve[1])} ${coords(curve[2])} ${coords(curve[3])}`, {
      fill: 'none', stroke: 'transparent', 'stroke-width': 30
    });
  }

  // Broad, shallow roots with smaller forks rather than straight radial spikes.
  const collar=path($('Roots'), 'M362 500 C382 515 369 525 350 531 C375 533 388 521 400 513 C411 524 425 533 451 532 C430 522 421 513 438 500 Z', { fill:'var(--wood)' });
  const roots = [
    [[378,500],[371,535],[235,515],[153,552]],
    [[384,502],[384,546],[279,549],[223,605]],
    [[394,503],[408,550],[332,591],[329,644]],
    [[402,504],[379,559],[433,599],[417,665]],
    [[414,502],[412,549],[525,556],[555,614]],
    [[423,500],[438,532],[569,520],[646,557]]
  ];
  roots.forEach((curve, index) => {
    limb($('Roots'), curve, 24, true, .04+index*.025, .85);
    for (let j = 0; j < 4; j++) {
      const start = point(curve, .32 + j*.16);
      const v = unit(tangent(curve, .32 + j*.16));
      const side = index < 3 ? -1 : 1;
      const end = [start[0] + side*(30 + j*7), start[1] + 21 + (j%2)*20];
      const fork = [start, [start[0]+v[0]*20,start[1]+v[1]*20], [end[0]-side*14,end[1]-22], end];
      const forkStart=.04+index*.025+arcFraction(curve,.32+j*.16)*.85;
      limb($('Roots'), fork, 5.5-j*.6, false, forkStart, .35);
      const joint = point(fork, .6);
      limb($('Roots'), [joint, [joint[0]+side*7,joint[1]+6], [joint[0]-side*5,joint[1]+19], [joint[0]+side*8,joint[1]+30]], 2, false, forkStart+arcFraction(fork,.6)*.35, .25);
    }
  });

  // Programme boughs and a central leader form a rounded crown. Their first tangents flow up
  // through the trunk; their tips spread out, following the reference trees.
  const boughs = [
    [[392,427],[375,366],[208,387],[117,306]],
    [[392,408],[367,326],[220,288],[182,184]],
    [[396,377],[416,303],[278,229],[311,110]],
    [[405,384],[384,310],[520,231],[492,103]],
    [[410,413],[433,335],[581,293],[624,182]],
    [[411,429],[439,370],[603,389],[684,302]],
    [[400,372],[386,265],[430,185],[402,87]]
  ];
  revealAlong($('Trunk'),'M400 503 C400 430 402 335 400 245',100,.08,1.15);
  const leafSlots = [], petioles=[];
  boughs.forEach((curve, branchIndex) => {
    const wood = element('g', $('Branches'), { 'data-programme': branchIndex % Math.max(1,SIBU_DATA.Programmes.length) });
    const branchStart=.08+(500-curve[0][1])/258*1.15;
    limb(wood, curve, branchIndex===6?18:29, true, branchStart, 1.15);
    for (let j = 0; j < 8; j++) {
      const t = .28 + j*.095;
      const start = point(curve,t), v = unit(tangent(curve,t));
      const side = j%2 ? 1 : -1;
      const normal = [-v[1],v[0]];
      const reach = 35 + 12*Math.sin(j*1.7+branchIndex);
      const end = [start[0]+v[0]*40+normal[0]*side*reach, start[1]+v[1]*40+normal[1]*side*reach];
      const twig = [start, [start[0]+v[0]*24,start[1]+v[1]*24], [end[0]-v[0]*18,end[1]-v[1]*18], end];
      const twigStart=branchStart+arcFraction(curve,t)*1.15;
      limb(wood, twig, 6.5, false, twigStart, .42);
      for (let k = 0; k < 3; k++) {
        const fraction = .2+k*.38;
        const base = point(twig,fraction), direction = unit(tangent(twig,fraction));
        const spread = ((k+j)%2 ? 1 : -1)*1.35;
        const leafDirection = unit([direction[0]-direction[1]*spread, direction[1]+direction[0]*spread]);
        const stemTip = [base[0]+leafDirection[0]*7,base[1]+leafDirection[1]*7];
        const petiole=path(wood, `M${coords(base)} Q${coords([base[0]+direction[0]*4,base[1]+direction[1]*4])} ${coords(stemTip)}`, {
          fill:'none', stroke:'var(--wood)', 'stroke-width':1.1
        });
        const leafStart=twigStart+arcFraction(twig,fraction)*.42+.09;
        petioles.push({node:petiole,start:leafStart-.08});
        leafSlots.push({ x:stemTip[0], y:stemTip[1], angle:Math.atan2(leafDirection[0],-leafDirection[1])*180/Math.PI,
          size:(.52+(k%3)*.02)*1.44, programme:branchIndex, start:leafStart });
      }
    }
    const end = curve[3], v = tangent(curve,1);
    leafSlots.push({x:end[0],y:end[1],angle:Math.atan2(v[0],-v[1])*180/Math.PI,size:.54*1.44,programme:branchIndex,start:branchStart+1.2});
  });

  // Feather-like alternating groups follow every twig, including the low
  // right-hand bough. Conservative circular envelopes keep the resting
  // silhouettes separate, with extra breathing room for the hover motion.
  const arranged=leafSlots.map(slot=>{
    const angle=slot.angle*Math.PI/180;
    const x=slot.x+Math.sin(angle)*18*slot.size;
    const y=slot.y-Math.cos(angle)*18*slot.size;
    return {slot,x,y,anchorX:x,anchorY:y,radius:18*slot.size};
  });
  const branchClearance=boughs.flatMap(curve=>Array.from({length:25},(_,i)=>{
    const t=i/24,p=point(curve,t);
    return {x:p[0],y:p[1],radius:14.5*Math.pow(1-t,1.35)+1};
  }));
  for(let pass=0;pass<360;pass++) {
    // Early passes preserve the ordered groups; final passes only resolve gaps.
    if(pass<100)arranged.forEach(p=>{p.x+=(p.anchorX-p.x)*.025;p.y+=(p.anchorY-p.y)*.025;});
    for(let i=0;i<arranged.length;i++) {
      const a=arranged[i];
      for(let j=i+1;j<arranged.length;j++) {
        const b=arranged[j],dx=b.x-a.x,dy=b.y-a.y;
        const distance=Math.hypot(dx,dy),minimum=a.radius+b.radius+3;
        if(distance>=minimum)continue;
        const angle=(i+j)*2.399963;
        const nx=distance>1e-6?dx/distance:Math.cos(angle),ny=distance>1e-6?dy/distance:Math.sin(angle);
        const push=(minimum-distance)*.505;
        a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
      }
      for(const branch of pass<180?branchClearance:[]) {
        const dx=a.x-branch.x,dy=a.y-branch.y,d=Math.hypot(dx,dy),minimum=a.radius+branch.radius+2;
        if(d<minimum && d>1e-6){a.x+=dx/d*(minimum-d);a.y+=dy/d*(minimum-d);}
      }
    }
  }
  arranged.forEach(({slot,x,y})=>{
    const angle=slot.angle*Math.PI/180;
    slot.x=x-Math.sin(angle)*18*slot.size;
    slot.y=y+Math.cos(angle)*18*slot.size;
  });

  const latest = Math.max(0, ...SIBU_DATA.News.map(item => Date.parse(item.date) || 0));
  const total = Math.max(leafSlots.length, SIBU_DATA.News.length);
  const newsBySlot = new Map(SIBU_DATA.News.map((item,i) => [Math.floor((i+.5)*leafSlots.length/SIBU_DATA.News.length),item]));
  for (let i = 0; i < total; i++) {
    const slot = leafSlots[i % leafSlots.length];
    const item = newsBySlot.get(i) || SIBU_DATA.Programmes[slot.programme % Math.max(1,SIBU_DATA.Programmes.length)] || SIBU_DATA.Leaves;
    const fresh = !!item.date && Date.parse(item.date) === latest;
    const placement = element('g', $('Leaves'), {
      transform:`translate(${slot.x} ${slot.y}) rotate(${slot.angle}) scale(${slot.size})`,
      'data-content-title':item.title, 'aria-hidden':'true'
    });
    // Hit areas stay still while the painted leaf moves, preventing hover flicker.
    element('circle',placement,{cx:0,cy:-17,r:20,fill:'transparent','pointer-events':'all'});
    const reveal = element('g', placement, {class:'leaf-reveal', 'data-start':slot.start});
    const animated = element('g', reveal, {class:'foliage','pointer-events':'none'});
    const title = element('title', animated); title.textContent = item.title;
    path(animated, 'M0 0 C-12 -8 -15 -25 0 -36 C15 -25 12 -8 0 0Z', {
      fill:`var(--green-${fresh?3:1+(i*7+slot.programme)%3})`
    });
    path(animated, 'M0 0 L0 -30', {fill:'none',stroke:'transparent','stroke-width':30});
  }
  // All generated drawing paths are now immutable. Only empty wrapper groups
  // animate, so resets can never overwrite an authored leaf placement.
  const foliage = [...section.querySelectorAll('.foliage')];
  const leafReveals = [...section.querySelectorAll('.leaf-reveal')];
  [['Roots','rootMotion'],['Programmes','programmeMotion'],['Leaves','leafMotion']].forEach(([id,motionId])=>{
    const parent=$(id), wrapper=element('g',parent,{id:motionId});
    [...parent.children].filter(node=>node!==wrapper).forEach(node=>wrapper.append(node));
  });

  // Resting hit areas keep hover stable as the canopy expands away from the pointer.
  const leafHits=element('g',$('Leaves'),{'aria-hidden':'true'});
  [...$('leafMotion').children].forEach(placement=>{
    const hit=element('g',leafHits,{transform:placement.getAttribute('transform')});
    hit.append(placement.querySelector('circle').cloneNode(true));
  });

  // SVG paints later siblings in front. Keep the original order for restoration.
  const paintOrder=[$('treeArt'),$('Crown')].map(parent=>({parent,nodes:[...parent.children]}));
  function bringRegionForward(key) {
    paintOrder.forEach(({parent,nodes})=>nodes.forEach((node,index)=>{
      if(parent.children[index]!==node)parent.insertBefore(node,parent.children[index]||null);
    }));
    if(!key)return;
    const node=$(key);
    node.parentNode.append(node);
    if(key!=='Roots')$('treeArt').append($('Crown'));
  }
  // Animate the wrapper attributes directly: SVG reordering must not restart
  // CSS transitions when a hovered region is brought to the front.
  const hoverMotion=[['Roots','rootMotion',1.06,1.09],['Programmes','programmeMotion',1.04,1.05],['Leaves','leafMotion',1.04,1.05]]
    .map(([key,id,expandedX,expandedY])=>({key,node:$(id),expandedX,expandedY,x:1,y:1}));
  let hoverFrame=0;
  function easeHover(key) {
    cancelAnimationFrame(hoverFrame);
    const start=performance.now();
    hoverMotion.forEach(p=>{
      p.fromX=p.x;p.fromY=p.y;
      p.toX=p.key===key&&!reducedMotion.matches?p.expandedX:1;
      p.toY=p.key===key&&!reducedMotion.matches?p.expandedY:1;
    });
    const tick=time=>{
      const t=reducedMotion.matches?1:Math.min(1,(time-start)/550);
      const eased=(1-Math.cos(Math.PI*t))/2;
      hoverMotion.forEach(p=>{
        p.x=p.fromX+(p.toX-p.fromX)*eased;p.y=p.fromY+(p.toY-p.fromY)*eased;
        p.node.setAttribute('transform',`translate(400 500) scale(${p.x} ${p.y}) translate(-400 -500)`);
      });
      hoverFrame=t<1?requestAnimationFrame(tick):0;
    };
    tick(start);
  }
  let activeRegion = null;
  function highlight(key) {
    if (drawer.open) return;
    if(activeRegion!==key){bringRegionForward(key);easeHover(key);}
    activeRegion = key;
    if(key==='Leaves' && !growthFrame)startBreeze();
    tiers.forEach(node => {
      node.classList.toggle('is-active',node.id===key);
      node.style.opacity=!key || node.id===key ? '1' : '.4';
    });
    if (key) {
      $('treeContext').firstElementChild.textContent = destinations[key].title;
      $('treeContext').lastElementChild.textContent = 'Click, tap, or press Enter to explore.';
    }
    $('treeContext').classList.toggle('visible', !!key);
  }
  keys.forEach(key => {
    const node = $(key);
    node.setAttribute('aria-label', destinations[key].title);
    node.setAttribute('aria-description', 'Open the '+destinations[key].title+' page overlay');
    node.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') highlight(key); });
    node.addEventListener('pointerleave', () => highlight(document.activeElement?.matches(':focus-visible') && keys.includes(document.activeElement.id)?document.activeElement.id:null));
    node.addEventListener('focus', () => highlight(key));
    node.addEventListener('blur', () => highlight(null));
    node.addEventListener('click', () => openPanel(key));
    node.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openPanel(key); }
    });
  });
  function openPanel(key) {
    if (drawer.open) return;
    clearTimeout(pendingGrowth);
    finishGrowth();
    opener = $(key);
    highlight(null);
    const data = destinations[key];
    $('treeDrawerTitle').textContent = data.title;
    const page = $('treePage');
    page.title = data.title+' — classic page';
    page.src = data.href+'?treeOverlay=1&v=2';
    drawer.showModal();
    document.body.classList.add('tree-modal-open');
    $('treeClose').focus();
  }
  window.addEventListener('message',event => {
    if(event.origin!==location.origin || event.source!==$('treePage').contentWindow)return;
    if(event.data==='close-tree-overlay')drawer.close();
    if(event.data==='focus-tree-close')$('treeClose').focus();
  });
  drawer.addEventListener('cancel',event=>{
    if($('treePage').contentDocument?.querySelector('#article-modal')?.open) {
      event.preventDefault();
      $('treePage').contentWindow.postMessage('back-to-news',location.origin);
    }
  });
  $('treeClose').addEventListener('click',()=>drawer.close());
  $('treeClose').addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const doc=$('treePage').contentDocument;
    const targets=doc?[...doc.querySelectorAll('a[href],button,input,select,textarea,[tabindex="0"]')].filter(node=>node.getClientRects().length && !node.disabled):[];
    event.preventDefault();
    if(targets.length)(event.shiftKey?targets.at(-1):targets[0]).focus();
    else if(doc?.querySelector('main')) {
      const main=doc.querySelector('main');main.tabIndex=-1;main.focus();
    }
  });
  drawer.addEventListener('click',event=>{
    if(event.target!==drawer)return;
    const r=drawer.getBoundingClientRect();
    if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)drawer.close();
  });
  drawer.addEventListener('close',()=>{
    document.body.classList.remove('tree-modal-open');
    svg.setAttribute('viewBox',HOME);
    if(visual) { opener?.focus(); if(!reducedMotion.matches)startBreeze(); }
    else toggle.focus();
    highlight(null);
  });

  function finishGrowth() {
    cancelAnimationFrame(growthFrame);growthFrame=0;growthTime=2.9;
    growthParts.forEach(part=>part.node.removeAttribute('mask'));
    leafReveals.forEach(node=>{node.removeAttribute('transform');node.removeAttribute('opacity');});
    petioles.forEach(part=>part.node.removeAttribute('opacity'));
    collar.removeAttribute('opacity');
  }
  function prepareGrowth() {
    growthTime=0;
    growthParts.forEach(part=>{
      part.node.setAttribute('mask',`url(#${part.id})`);
      part.stroke.setAttribute('d','M0 0');
    });
    leafReveals.forEach(node=>{node.setAttribute('transform','scale(0)');node.setAttribute('opacity','0');});
    petioles.forEach(part=>part.node.setAttribute('opacity','0'));
    collar.setAttribute('opacity','0');
  }
  function resetAnimation() {
    clearTimeout(pendingGrowth);
    finishGrowth();stopBreeze();
    svg.setAttribute('viewBox',HOME);
    highlight(null);
  }
  // One animation clock; wrapper rotations never alter authored leaf placements.
  let breezeFrame = 0, previousTime = 0, nextFall = 6, elapsed = 0;
  let swayPhase = 0, swayAmount = 0;
  const falling = [];
  const fallLayer = element('g', svg, {'aria-hidden':'true','pointer-events':'none'});
  function stopBreeze() {
    cancelAnimationFrame(breezeFrame); breezeFrame=0; previousTime=0;
    falling.splice(0).forEach(item=>item.node.remove());
    foliage.forEach(node=>node.removeAttribute('transform'));
    swayPhase=0; swayAmount=0; elapsed=0; nextFall=6;
  }
  function startBreeze() {
    if(breezeFrame || !visual || reducedMotion.matches)return;
    previousTime=0;
    const tick = time => {
      breezeFrame=0;
      if(!visual || reducedMotion.matches)return;
      const dt=previousTime?Math.min((time-previousTime)/1000,.05):0;
      previousTime=time;
      if(!drawer.open && !document.hidden) {
        const target=activeRegion==='Leaves'?1:.3;
        swayAmount += (target-swayAmount)*Math.min(1,dt*5);
        if(!target && swayAmount<.002)swayAmount=0;
        if(swayAmount) {
          swayPhase += dt;
          foliage.forEach((node,i)=>node.setAttribute('transform',`rotate(${Math.sin(swayPhase*2.1+i*.43)*(9+i%5)*swayAmount})`));
        } else foliage.forEach(node=>node.removeAttribute('transform'));
        elapsed+=dt;
        if(elapsed>nextFall && falling.length<3) {
          nextFall=elapsed+4+Math.random()*4;
          const source=foliage[Math.floor(Math.random()*foliage.length)];
          const origin=new DOMPoint(0,0).matrixTransform(source.getCTM()).matrixTransform(svg.getCTM().inverse());
          const node=element('g',fallLayer);
          const shape=source.querySelector('path').cloneNode(true);
          shape.setAttribute('fill',getComputedStyle(source.querySelector('path')).fill);
          node.append(shape);
          falling.push({node,x:origin.x,y:origin.y,age:0,angle:Math.random()*120});
        }
        for(let i=falling.length-1;i>=0;i--) {
          const leaf=falling[i]; leaf.age+=dt;
          const progress=leaf.age/5;
          leaf.node.setAttribute('transform',`translate(${leaf.x+Math.sin(leaf.age*1.7)*22} ${leaf.y+(700-leaf.y)*progress}) rotate(${leaf.angle+leaf.age*35}) scale(.85)`);
          leaf.node.setAttribute('opacity',String(Math.max(0,1-progress*1.25)));
          if(progress>=.8){leaf.node.remove();falling.splice(i,1);}
        }
      }
      breezeFrame=requestAnimationFrame(tick);
    };
    breezeFrame=requestAnimationFrame(tick);
  }
  function renderGrowth(elapsed) {
    growthTime=elapsed;
    const progress=(t,start,duration)=>Math.min(1,Math.max(0,(t-start)/duration));
    collar.setAttribute('opacity',String(progress(elapsed,0,.18)));
      growthParts.forEach(part=>{
        const p=progress(elapsed,part.start,part.duration);
        if(p===1){part.node.removeAttribute('mask');return;}
        part.node.setAttribute('mask',`url(#${part.id})`);
        if(p===0){part.stroke.setAttribute('d','M0 0');return;}
        const left=[],right=[];
        for(let i=0;i<=40;i++) {
          const t=p*i/40, position=t*80, index=Math.min(79,Math.floor(position));
          const a=part.samples[index],b=part.samples[index+1],mix=position-index;
          const x=a.x+(b.x-a.x)*mix,y=a.y+(b.y-a.y)*mix;
          const nx=a.nx+(b.nx-a.nx)*mix,ny=a.ny+(b.ny-a.ny)*mix;
          // The growing tip narrows into a bud rather than a flat clipped end.
          const taper=Math.min(1,(p-t)/.14);
          const radius=part.width*.55*taper;
          left.push([x+nx*radius,y+ny*radius]);right.push([x-nx*radius,y-ny*radius]);
        }
        part.stroke.setAttribute('d','M'+left.concat(right.reverse()).map(coords).join(' L')+' Z');
      });
      petioles.forEach(part=>part.node.setAttribute('opacity',String(progress(elapsed,part.start,.1))));
      leafReveals.forEach(node=>{
        const p=progress(elapsed,Number(node.dataset.start),.38);
        const eased=p*p*(3-2*p);
        node.setAttribute('transform',`scale(${eased})`);
        node.setAttribute('opacity',String(p));
      });
  }
  function grow() {
    if(!visual || reducedMotion.matches){finishGrowth();return;}
    let elapsed=0, previous=0;
    const tick=time=>{
      const dt=previous?Math.min((time-previous)/1000,.05):0;previous=time;
      if(!document.hidden)elapsed+=dt;
      renderGrowth(Math.min(2.9,elapsed));
      if(elapsed<2.9)growthFrame=requestAnimationFrame(tick);
      else {finishGrowth();startBreeze();}
    };
    growthFrame=requestAnimationFrame(tick);
  }
  function clearTreeExit() {
    document.body.classList.remove('tree-returning');
    section.classList.remove('tree-exiting');
    section.removeAttribute('style');section.inert=false;
    section.hidden=!visual;
  }
  function reverseGrowth(from) {
    let start;
    renderGrowth(from);
    const tick=time=>{
      start??=time;
      const progress=Math.min(1,(time-start)/320);
      renderGrowth(from*(1-progress));
      if(progress<1)growthFrame=requestAnimationFrame(tick);
      else {growthFrame=0;clearTreeExit();}
    };
    growthFrame=requestAnimationFrame(tick);
  }
  function clearModeTransition() {
    clearTreeExit();
    modeTransition?.kill?.();modeTransition?.cancel?.();
    transitionAnimations.splice(0).forEach(animation=>animation.cancel());
    transitionGhosts.splice(0).forEach(node=>node.remove());
    if(gs)gs.set([toggle,logo,...nav.children],{clearProps:'transform,opacity,filter,visibility'});
    else [toggle,logo,...nav.children].forEach(node=>{node.style.transform='';node.style.opacity='';node.style.filter='';});
  }
  function outgoingCopy(node) {
    const rect=node.getBoundingClientRect(), opacity=getComputedStyle(node).opacity;
    const ghost=node.cloneNode(true);
    ghost.removeAttribute('id');ghost.hidden=false;ghost.inert=true;ghost.setAttribute('aria-hidden','true');
    Object.assign(ghost.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:'0',opacity,transform:'none',pointerEvents:'none',zIndex:'5'});
    document.body.append(ghost);transitionGhosts.push(ghost);return ghost;
  }
  toggle.addEventListener('click',()=>{
    const oldRect=toggle.getBoundingClientRect();
    const treeRect=section.getBoundingClientRect(), exitFrom=growthTime;
    clearModeTransition();
    const entering=!visual;
    const ghosts=entering && !reducedMotion.matches?[outgoingCopy(logo),outgoingCopy(nav)]:[];
    visual=entering;resetAnimation();
    if(drawer.open)drawer.close();
    toggle.setAttribute('aria-checked',String(visual));
    toggle.setAttribute('aria-label',visual?'Switch to classic mode':'Switch to visualized mode');
    document.body.dataset.mode=visual?'visualized':'classic';
    section.hidden=!visual;
    if(!visual && !reducedMotion.matches) {
      section.hidden=false;section.inert=true;section.classList.add('tree-exiting');
      document.body.classList.add('tree-returning');
      Object.assign(section.style,{position:'fixed',left:treeRect.left+'px',top:treeRect.top+'px',width:treeRect.width+'px',margin:'0',pointerEvents:'none'});
      reverseGrowth(exitFrom);
    }
    logo.hidden=visual;logo.style.display=visual?'none':'';
    nav.hidden=visual;nav.style.display=visual?'none':'';
    document.body.style.paddingTop=visual?'3rem':'20vh';
    const newRect=toggle.getBoundingClientRect();
    if(reducedMotion.matches)return;
    const x=oldRect.left-newRect.left,y=oldRect.top-newRect.top;
    if(gs) {
      modeTransition=gs.timeline({onComplete:()=>{
        transitionGhosts.splice(0).forEach(node=>node.remove());
        gs.set([toggle,logo,...nav.children],{clearProps:'transform,opacity,filter,visibility'});
      }});
      modeTransition.fromTo(toggle,{x,y},{x:0,y:0,duration:.95,ease:'power3.inOut'},0);
      if(visual) {
        modeTransition.to(ghosts[0],{y:-32,scale:.9,opacity:0,filter:'blur(5px)',duration:.55,ease:'power2.in'},0);
        modeTransition.to(ghosts[1],{y:18,opacity:0,filter:'blur(3px)',duration:.4,ease:'power2.in'},.06);
      } else {
        modeTransition.fromTo(logo,{y:24,scale:.92,opacity:0,filter:'blur(6px)'},{y:0,scale:1,opacity:1,filter:'blur(0px)',duration:.45,ease:'power3.out'},.36);
        modeTransition.fromTo([...nav.children],{y:18,opacity:0,filter:'blur(3px)'},{y:0,opacity:1,filter:'blur(0px)',duration:.35,stagger:.05,ease:'power2.out'},.42);
      }
    } else {
      // Retain animated navigation if the optional GSAP file cannot be loaded.
      modeTransition=toggle.animate([{transform:`translate(${x}px,${y}px)`},{transform:'none'}],{duration:950,easing:'ease-in-out'});
      ghosts.forEach(ghost=>{
        const animation=ghost.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-24px)'}],{duration:500,fill:'forwards'});
        animation.onfinish=()=>ghost.remove();transitionAnimations.push(animation);
      });
      if(!visual)[logo,...nav.children].forEach((node,i)=>transitionAnimations.push(node.animate([{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],{duration:450,delay:360+i*50,fill:'backwards'})));
    }
    if(visual){prepareGrowth();pendingGrowth=setTimeout(grow,650);}
  });
  reducedMotion.addEventListener('change',()=>{
    clearModeTransition();resetAnimation();easeHover(null);
    if(visual && !reducedMotion.matches)startBreeze();
  });
  document.addEventListener('visibilitychange',()=>{
    previousTime=0;
  });
});
  </script>
</body>

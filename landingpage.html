<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sibu Kamek | Let's Build Sibu Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="logo-optimized.webp" type="image/webp" fetchpriority="high">
  <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding-top: 40vh;
  background: #0f0f10;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
  text-align: center;
}

.landing-logo {
  display: block;
  width: 200px;
  height: 225px;
  object-fit: contain;
  margin: 0 auto 1rem;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  margin-bottom: 1.5rem;
  flex-wrap: nowrap;
}

.title {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-family: 'Covered By Your Grace', cursive;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0;
  transform-origin: center center;
}

/* Pill mode switch */
.mode-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 64px;
  height: 34px;
  padding: 4px;
  background: #232326;
  border: 1px solid #35353a;
  border-radius: 999px;
  cursor: pointer;
  flex-shrink: 0;
}

.mode-pill:hover {
  border-color: #4a4a52;
}

.mode-pill:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
}

.pill-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.25s ease;
  z-index: 1;
}

.mode-pill[aria-checked="true"] .pill-thumb {
  transform: translateX(30px);
}

.pill-icon {
  position: relative;
  z-index: 2;
  width: 22px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #b3b3b3;
  pointer-events: none;
  margin: 0 1px;
}

.pill-icon svg {
  width: 15px;
  height: 15px;
}

.mode-pill[aria-checked="false"] .pill-icon--classic {
  color: #0f0f10;
}

.mode-pill[aria-checked="true"] .pill-icon--visual {
  color: #0f0f10;
}

.links {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.link {
  color: #b3b3b3;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  padding: 0.4rem 0.2rem;
  border-bottom: 2px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.link:hover,
.link:focus {
  color: #ffffff;
  border-bottom-color: #ffffff;
}
  </style>
</head>
<body>
  <main class="container">
    <img class="landing-logo" src="logo-optimized.webp" alt="Sibu Kamek Logo" width="200" height="225" fetchpriority="high" decoding="async">
    <div class="header-row">
      <h1 class="title">Sibu Kamek</h1>

      <button class="mode-pill" id="modeToggle" type="button" role="switch" aria-checked="false" aria-label="Switch to visualized mode">
        <span class="pill-thumb"></span>
        <span class="pill-icon pill-icon--classic" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M256-240h84l44-122h192l44 122h84L522-720h-84L256-240Zm152-192 70-198h4l70 198H408ZM160-80q-33 0-56.5-23.5T80-160v-640q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v640q0 33-23.5 56.5T800-80H160Zm0-80h640v-640H160v640Zm0-640v640-640Z"/></svg>
        </span>
        <span class="pill-icon pill-icon--visual" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Z"/></svg>
        </span>
      </button>
    </div>

    <nav class="links" aria-label="Main navigation">
      <a href="about.html" class="link">About</a>
      <a href="programmes.html" class="link">Programmes</a>
      <a href="news.html" class="link">News</a>
      <a href="contact.html" class="link">Contact</a>
    </nav>
  </main>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const links = document.querySelectorAll('.link');
  const nav = document.querySelector('.links');
  const title = document.querySelector('.title');
  const logo = document.querySelector('.landing-logo');
  const modeToggle = document.getElementById('modeToggle');

  // Pill mode switch: classic <-> visualized (animated with GSAP)
  modeToggle.addEventListener('click', () => {
    const isVisualized = modeToggle.getAttribute('aria-checked') === 'true';
    const next = !isVisualized;

    modeToggle.setAttribute('aria-checked', String(next));
    modeToggle.setAttribute(
      'aria-label',
      next ? 'Switch to classic mode' : 'Switch to visualized mode'
    );

    document.body.dataset.mode = next ? 'visualized' : 'classic';
    applyMode(next ? 'visualized' : 'classic');
  });

  function applyMode(mode) {
    const ease = 'power3.inOut';
    const duration = 0.8;

    if (mode === 'visualized') {
      gsap.to(document.body, { paddingTop: '3rem', duration, ease });
      gsap.to(title, { scale: 0.65, duration, ease });
      gsap.to(logo, {
        opacity: 0,
        y: -12,
        height: 0,
        marginBottom: 0,
        duration: 0.35,
        ease: 'power2.in',
        onComplete: () => {
          logo.style.visibility = 'hidden';
        }
      });
      gsap.to(nav, {
        opacity: 0,
        y: -12,
        duration: 0.35,
        ease: 'power2.in',
        onComplete: () => {
          nav.style.display = 'none';
        }
      });
    } else {
      gsap.to(document.body, { paddingTop: '40vh', duration, ease });
      gsap.to(title, { scale: 1, duration, ease });
      logo.style.visibility = 'visible';
      gsap.fromTo(
        logo,
        { opacity: 0, y: -12, height: 0, marginBottom: 0 },
        { opacity: 1, y: 0, height: 225, marginBottom: '1rem', duration: 0.4, delay: 0.3, ease: 'power2.out' }
      );

      nav.style.display = 'flex';
      gsap.fromTo(
        nav,
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.4, delay: 0.3, ease: 'power2.out' }
      );
    }

    console.log(`Mode switched to: ${mode}`);
  }
});
  </script>
</body>
</html>
